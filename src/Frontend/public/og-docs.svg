<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Klassd Docs — build a code-first headless CMS in C#">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fb5b4c" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#0b0b17" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b0b17"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow -->
  <text x="104" y="150"
        font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace"
        font-size="26" font-weight="600" letter-spacing="6" fill="#fb5b4c">DOCUMENTATION</text>

  <!-- wordmark -->
  <text x="100" y="282"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="120" font-weight="800" letter-spacing="-4">
    <tspan fill="#ededef">Klass</tspan><tspan fill="#fb5b4c">d</tspan>
  </text>

  <!-- tagline -->
  <text x="104" y="372"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="46" font-weight="600" fill="#e7e7f0">Build a headless CMS in C#</text>

  <text x="104" y="438"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="400" fill="#9aa0b4">Quickstart, content types, property types, the delivery</text>
  <text x="104" y="480"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="400" fill="#9aa0b4">API — and how Klassd compares to Umbraco &amp; Payload.</text>

  <!-- url pill -->
  <rect x="104" y="540" width="316" height="56" rx="28" fill="none" stroke="#23233f" stroke-width="2"/>
  <text x="262" y="577" text-anchor="middle"
        font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace"
        font-size="26" font-weight="500" fill="#fb5b4c">getklassd.com/docs</text>
</svg>
