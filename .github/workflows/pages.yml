name: Deploy to GitHub Pages

# Prerender the site to static HTML and publish it to GitHub Pages.
# GitHub Pages serves static files only, so this builds + boots the CMS, bakes the
# content into dist/client (see src/Frontend/prerender.ts), and deploys that.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # Klassd engine (public https submodule)

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Build + boot the CMS, then build the client/SSR bundles and prerender against it,
      # all in one step so the CMS stays alive for the build-time content fetch.
      - name: Build + prerender
        working-directory: src/Frontend
        env:
          ASPNETCORE_URLS: http://localhost:5080
          CMS_BASE: http://localhost:5080
          BASE_PATH: /            # custom domain (getklassd.com) serves at root
        run: |
          dotnet build ../Backend/GetKlassd.Cms.csproj -c Release
          dotnet run --project ../Backend -c Release --no-build &
          CMS_PID=$!
          for i in $(seq 1 60); do curl -sf "$CMS_BASE/api/pages?locale=en" >/dev/null && break; sleep 2; done
          bun install --frozen-lockfile
          bun run build:static
          kill $CMS_PID || true

      # Generate the API reference with DocFX and drop it into the deploy artifact at
      # dist/client/docs/api. Runs AFTER build:static — vite empties dist/client on build,
      # so this must come last or its output would be wiped.
      - name: Build API reference (DocFX)
        run: |
          dotnet tool restore
          dotnet docfx docfx/docfx.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/Frontend/dist/client

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
