name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Build CMS (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # pulls the public Klassd engine (https submodule)

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Backend/GetKlassd.Cms.csproj -c Release

  frontend:
    name: Build site (Bun SSR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        working-directory: src/Frontend
        run: bun install --frozen-lockfile

      - name: Build (type-check + client + SSR bundles)
        working-directory: src/Frontend
        run: bun run build
